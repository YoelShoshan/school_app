<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b1d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המשימות שלי">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Compound V</title>
<script>
try{var s=JSON.parse(localStorage.getItem('hw.settings.v1')||'{}');if(s.theme&&s.theme!=='auto')document.documentElement.setAttribute('data-theme',s.theme);}catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<!-- Supabase client (only acts if config.js is filled in; otherwise app stays local-only) -->
<script>
  window.supabaseReady = new Promise((resolve)=>{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=resolve; s.onerror=resolve; // resolve either way; app works offline/local
    document.head.appendChild(s);
  });
</script>
<script src="config.js"></script>
<script src="storage-supabase.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // When a new SW is found and installed, activate it and reload once.
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            nw.postMessage('skipWaiting');
          }
        });
      });
      // Check for updates on each load and periodically.
      reg.update();
      setInterval(()=>reg.update(), 60*1000);
    }).catch(()=>{});

    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloaded) return; reloaded = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
